<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>华文练习</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
/* Home: a menu of practice sets, grouped by category. No progress here — that is on the parent dashboard. */
:root{
  --paper:#F6F8FC; --surface:#FFFFFF; --ink:#18233A; --muted:#5B6782; --line:#D6DDEB;
  --blue:#2350C8; --blue-soft:#E3EAFB; --hl:#FFE066; --good:#1E8A4C; --bad:#C23B3B;
  --display:"Baloo 2","Noto Sans SC","PingFang SC",system-ui,sans-serif; --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--paper:#0F1626;--surface:#172238;--ink:#E8EDF7;--muted:#9AA6C0;--line:#2B3954;--blue:#7FA2FF;--blue-soft:#1F2D4D;--hl:#8A6F00;--good:#5BD08A;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:900 clamp(28px,6vw,40px)/1.15 var(--body);text-wrap:balance}
h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit}
.sub{margin:4px 0 0;color:var(--muted)}
.who{font-size:15px;color:var(--muted)}
.who button{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ch{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit}
.ch:hover{border-color:var(--blue)}
.num{width:56px;height:50px;border:3px solid var(--ink);display:grid;place-items:center;font:900 24px/1 var(--body)}
.name{font:700 20px/1.3 var(--body)}
.meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:2/-1;height:6px;background:var(--blue-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.go{font:700 16px/1 var(--body);color:var(--blue)}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--bad)}
.sum{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;font-size:16px}
.sum b{font-family:var(--display);font-size:20px}
.steps{font-size:15px;color:var(--muted);margin:0}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:18px}
.btn{border:0;border-radius:12px;padding:12px 20px;font:700 18px/1 var(--body);background:var(--blue);color:var(--surface);cursor:pointer}
.books{display:flex;gap:8px;margin-top:10px}.books button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 16px;font:700 17px/1.2 var(--body);cursor:pointer}.books button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:480px){.ch{grid-template-columns:56px minmax(0,1fr)}.go{display:none}.num{width:50px;height:46px;font-size:20px}}
.cat{display:flex;flex-direction:column;gap:10px}
.cat h2{margin:6px 0 0;font:700 15px/1.3 var(--body);color:var(--muted);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--blue)}
.tile .num{flex:none;width:64px;height:56px;font-size:22px}
.tile .name{font:700 20px/1.3 var(--body)}
.tile .meta{display:block}
</style>
<body>
<div class="wrap">
  <header>
    <h1>华文<mark>练习</mark></h1>
    <p class="sub">选一项开始练习。</p>
  </header>
  <div id="who" class="who"></div>
  <div id="main"></div>
  <p class="note"><a href="dashboard.html" style="color:var(--blue)">家长看板：练习时间和进度 →</a></p>
</div>
<script>
/* 练习清单：以后加新练习，在这里加一行（章节号、看板里的名字在 dashboard.html 的 BOOKS 里另外登记）。
   旧网址 index.html?b=5A 会直接跳到练习页。 */
const PRACTICES=[
  {cat:"词语",items:[
    {box:"5A",name:"欢乐伙伴 5A",desc:"第一至九课 · 闪卡、词义、多音字、字辨",href:"practice.html?b=5A"},
    {box:"5B",name:"欢乐伙伴 5B",desc:"第十至十七课 · 闪卡、词义、多音字、字辨",href:"practice.html?b=5B"},
    {box:"6A",name:"欢乐伙伴 6A",desc:"第一至七课 · 闪卡、词义、多音字、字辨",href:"practice.html?b=6A"}]},
  {cat:"语文知识",items:[
    {box:"关联",name:"关联词",desc:"第一批 50 个 · 闪卡、做题",href:"practice.html?b=GL"}]}];
{const q=new URLSearchParams(location.search).get("b");if(q&&PRACTICES.some(c=>c.items.some(i=>i.href.endsWith("?b="+q))))location.replace("practice.html?b="+encodeURIComponent(q)+location.hash)}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cleanName=s=>String(s||"").trim().replace(/[^A-Za-z0-9 _-]/g,"").slice(0,30);
let LEARNER="";try{LEARNER=localStorage.getItem("vocab-learner")||""}catch(e){}
function start(){
  if(!LEARNER){
    $("#who").textContent="";
    $("#main").innerHTML=`<div class="card"><b style="font:700 22px/1.3 var(--body)">谁在练习？</b><p style="margin:0">输入一次名字就好。进度会用这个名字保存在网上，换一台设备也能接着练。</p><form id="f"><input id="nm" maxlength="30" placeholder="名字（用英文字母）" autocomplete="off"><button class="btn">开始</button></form><span class="note">请用英文字母或拼音输入，每次、每台设备都用同一个名字（和英文练习网站一样）。</span></div>`;
    $("#f").onsubmit=e=>{e.preventDefault();const n=cleanName($("#nm").value);if(!n)return;try{localStorage.setItem("vocab-learner",n)}catch(x){}LEARNER=n;start()};
    $("#nm").focus();return;
  }
  $("#who").innerHTML=`正在练习：<b>${esc(LEARNER)}</b> · <button id="chg">换名字</button>`;
  $("#chg").onclick=()=>{try{localStorage.removeItem("vocab-learner")}catch(e){}LEARNER="";start()};
  $("#main").innerHTML=PRACTICES.map(c=>`<section class="cat"><h2>${esc(c.cat)}</h2><div class="grid">${c.items.map(i=>
    `<a class="tile" href="${esc(i.href)}"><span class="num"${i.box.length>2?' style="font-size:18px"':""}>${esc(i.box)}</span><span><span class="name">${esc(i.name)}</span><span class="meta">${esc(i.desc)}</span></span></a>`).join("")}</div></section>`).join("");
}
start();
</script>
</body>
</html>
