<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欢乐伙伴 6A 词语</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
/* Layout: one workbook column — lesson box header, mode switch, lesson picker, then a single practice card. */
:root{
  --paper:#F6F8FC; --surface:#FFFFFF; --ink:#18233A; --muted:#5B6782; --line:#D6DDEB;
  --blue:#2350C8; --blue-soft:#E3EAFB; --hl:#FFE066; --red:#B8322A; --red-soft:#FBE9E6;
  --good:#1E8A4C; --good-soft:#DDF3E5; --bad:#C23B3B; --bad-soft:#FBE3E1;
  --display:"Baloo 2","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1626; --surface:#172238; --ink:#E8EDF7; --muted:#9AA6C0; --line:#2B3954;
  --blue:#7FA2FF; --blue-soft:#1F2D4D; --hl:#8A6F00; --red:#FF9A8F; --red-soft:#3A1F22;
  --good:#5BD08A; --good-soft:#163828; --bad:#FF8A80; --bad-soft:#3D1D1F; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1626; --surface:#172238; --ink:#E8EDF7; --muted:#9AA6C0; --line:#2B3954;
  --blue:#7FA2FF; --blue-soft:#1F2D4D; --hl:#8A6F00; --red:#FF9A8F; --red-soft:#3A1F22;
  --good:#5BD08A; --good-soft:#163828; --bad:#FF8A80; --bad-soft:#3D1D1F; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
mark{background:linear-gradient(transparent 52%, var(--hl) 52%);color:inherit;padding:0 2px}

/* header */
.head{display:flex;gap:16px;align-items:center}
.chbox{flex:none;width:76px;height:68px;border:4px solid var(--ink);display:grid;place-items:center;
  font:900 34px/1 var(--body);letter-spacing:.02em}
.head h1{margin:0;font:900 clamp(26px,6vw,38px)/1.15 var(--body);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px;letter-spacing:.04em}
.rule{border:2px solid var(--ink);padding:10px 14px;background:var(--surface);font-size:17px}

/* controls */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--blue-soft);padding:5px;border-radius:12px}
.modes button{border:0;background:transparent;padding:10px 4px;border-radius:9px;font:700 17px/1.15 var(--body);color:var(--blue)}
.modes button small{display:block;font:600 11px/1.2 var(--display);letter-spacing:.04em;opacity:.8}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar label{font-size:14px;color:var(--muted)}
select,input[type=search]{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
select{max-width:100%}
.grow{flex:1 1 220px}

/* card */
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.progress{height:6px;background:var(--blue-soft);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.sentence{font-size:22px;line-height:1.75;margin:0}
.sentence .target{font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--blue)}
.sentence .char{font-weight:900;color:var(--red);background:var(--red-soft);border-radius:6px;padding:0 4px}
.sentence .blank{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--red);text-align:center;color:var(--red);font-weight:900}
.ask{font:700 21px/1.4 var(--body);margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts.chars .opt span:last-child{font-size:30px;font-weight:700}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;min-height:56px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font:700 14px/1 var(--display)}
.opt .py{font:700 22px/1.2 var(--body);letter-spacing:.02em}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb h3{margin:0;font:900 21px/1.35 var(--body)}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{margin:0}
.en{color:var(--muted);font-size:15px}
.tip{font-size:16px;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px}
.tip b{color:var(--blue)}
.lbl{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font:700 18px/1 var(--body);background:var(--blue);color:var(--surface)}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.say{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.say svg{width:18px;height:18px}
.hint{font-size:13px;color:var(--muted);margin:0}
.py-inline{font-family:var(--body);font-weight:700;color:var(--blue)}

/* 多音字 box */
.poly{border:2px solid var(--red);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.poly h4{margin:0;font:900 17px/1.4 var(--body);color:var(--red)}
.poly p{margin:0;font-size:16px}

/* flashcard */
.flash{border:2px dashed var(--line);border-radius:14px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer;background:transparent;width:100%}
.flash .big{font:900 clamp(44px,11vw,72px)/1.1 var(--body);margin:0;overflow-wrap:anywhere}
.flash .eq{font-size:15px;color:var(--muted);letter-spacing:.04em}
.flash .bigpy{font:700 clamp(24px,6vw,34px)/1.1 var(--body);color:var(--blue);margin:0}
.flash .detail{text-align:left;align-self:stretch;display:flex;flex-direction:column;gap:6px;font-size:17px}
.flash .detail p{margin:0}

/* results + list */
.score{font:800 56px/1 var(--display);color:var(--blue);font-variant-numeric:tabular-nums}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.missed li{border-bottom:1px solid var(--line);padding-bottom:10px}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.wl .pair{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wl .pair b{font-size:22px}
.wl .m{grid-column:1/-1;font-size:16px;display:flex;flex-direction:column;gap:4px}
.wl .m p{margin:0}
.wl h3{grid-column:1/-1;margin:14px 0 0;font:900 17px/1.3 var(--body);color:var(--muted);border:0}
.wl li.sec{display:block;border-bottom:2px solid var(--ink);padding:16px 0 6px}
.star{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:8px}
.star[aria-pressed="true"]{background:var(--hl);color:var(--ink)}
.names{font-size:15px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .lab{font-size:13px;color:var(--muted);letter-spacing:.06em}
.tile .val{font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .det{font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{width:100%;min-width:0;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:has(+ tr td[colspan]) td{border-bottom:0}
.tbl td:first-child:not([colspan]){white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.status{margin:-6px 0 0;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.src{font-size:13px;color:var(--muted);margin:0}
#m-progress[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
footer{font-size:13px;color:var(--muted);text-align:center}
.head p.who{margin:6px 0 0;font-size:14px;color:var(--muted);letter-spacing:0}
.who a,.who button{color:var(--blue);background:none;border:0;padding:0;font:inherit;text-decoration:underline;cursor:pointer}
.savenote{margin:-10px 0 0;font-size:13px;color:var(--muted)}
.savenote.saved,.savenote.ready{color:var(--good)}
.savenote.error{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <div class="chbox" aria-label="欢乐伙伴 6A">6A</div>
    <div style="flex:1;min-width:0"><h1 id="title">欢乐伙伴 6A 词语</h1><p id="sub"></p><p class="who" id="who" hidden></p></div>
    <button class="btn ghost" id="m-progress" data-mode="progress" style="flex:none">记录</button>
  </header>
  <div class="rule" id="rule"></div>

  <nav class="modes" aria-label="练习方式">
    <button id="m-learn" data-mode="learn">① 闪卡<small>Cards</small></button>
    <button id="m-quiz" data-mode="quiz">② 词义<small>Meaning</small></button>
    <button id="m-poly" data-mode="poly">③ 多音字<small>Readings</small></button>
    <button id="m-zb" data-mode="zb">④ 字辨<small>Right word</small></button>
  </nav>

  <div class="bar" id="bar">
    <label for="set">练习</label>
    <select id="set" class="grow"></select>
    <button class="btn ghost" id="m-list" data-mode="list" style="padding:10px 16px">词语表</button>
  </div>
  <p class="status" id="status"></p>
  <p class="savenote checking" id="saveNote">正在确认进度保存在哪里……</p>

  <main id="stage" class="card" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>

<script>
// Each lesson: title, passages (name, last word number in that passage), words, names (pinyin only).
// Word format: 词|拼音|释义|English|搭配|字辨|例句
const LESSONS = [
{n:1,t:"加油！加油！",parts:[["生活看板《校园访谈》",10],["核心《石缝里的小花》",28]],w:[

"锻炼|duàn liàn|通过体育运动使身体强壮；也指在实践中使能力提高。|Exercise; train|锻炼身体 / 体育锻炼 / 锻炼意志|锻（炼）/ （练）习|爸爸每天早上都到公园跑步，锻炼身体。",
"做梦|zuò mèng|睡觉时脑子里出现各种景象。也比喻幻想。|Dream (while asleep)|常常做梦 / 做了一个梦 / 做美梦|做（梦）/ 树（林）/ （夕）阳|我最近晚上睡不好，常常做梦。",
"精神|jīng shen|表现出来的活力。|Energy; vigour|有精神 / 没精神 / 显得很精神|（精）神 / 眼（睛）。读音：jīng shen（活力）≠ jīng shén（思想、意识，如“精神食粮”）|睡了一个好觉，弟弟今天看起来特别有精神。",
"测验|cè yàn|用一定的方法检验学习成绩或能力。|Test; quiz|参加测验 / 数学测验 / 单元测验|测（验）/ 危（险）/ （检）查|明天有华文测验，我今晚要好好复习。",
"严格|yán gé|遵守规定或要求标准时认真，一点也不放松。|Strict|严格要求 / 严格遵守 / 管得很严格|严（格）/ （各）种 / 联（络）|我要严格要求自己，加倍努力，勤奋学习。",

"暴雨|bào yǔ|又大又急的雨。|Rainstorm|狂风暴雨 / 一场暴雨 / 暴雨倾盆|（暴）雨 / （爆）米花 / （瀑）布|一场暴雨过后，街道上到处都是积水。",

"恶劣|è liè|很坏；非常不好。|Harsh; very bad|恶劣的环境 / 天气恶劣 / 恶劣的行为|（恶）劣 / （亚）洲 / （哑）口无言。读音：è（恶劣）≠ ě（恶心）≠ wù（可恶）|在这么恶劣的环境下，它都不放弃。",

"意志|yì zhì|为了达到目的而坚持下去的决心。|Will; willpower|顽强的意志 / 意志坚强 / 锻炼意志|意（志）/ （忘）记 / （士）兵|它凭着顽强的意志，克服了种种困难。",

"7|益处|处|chǔ|跟别人一起生活、交往；安排、办理。|Get along; handle|相处 / 处理 / 处罚|chù（益处、到处）≠ chǔ（相处、处理）|他性格开朗，跟同学们相{处}得很好。",
"7|强劲|强|qiǎng/jiàng|qiǎng：勉强，硬要。jiàng：固执，不听劝。|Force; reluctantly / Stubborn|勉强 / 强迫；倔强|qiáng（强劲、坚强）≠ qiǎng（勉强）≠ jiàng（倔强）|他不想去，你就别勉{强}他了。／弟弟性格很倔{强}，做错了也不肯认错。",
"7|强劲|劲|jìn|力气；情绪、兴趣。|Strength; energy|使劲 / 干劲 / 没劲|jìng（强劲）≠ jìn（使劲、干劲）|大家干{劲}十足，很快就把课室打扫干净了。",
"1|恶劣|恶|ě/wù|ě：恶心，想要呕吐。wù：讨厌、憎恨。|Feel sick; loathe|恶心 / 可恶 / 厌恶|è（恶劣、凶恶）≠ ě（恶心）≠ wù（可恶、厌恶）|他晕车了，觉得很{恶}心。／小偷偷走了老人的钱，真可{恶}！",
"6|长江|长|zhǎng|生长；年纪大；领头的人。|Grow; elder; head|长大 / 生长 / 校长|cháng（长江、长短）≠ zhǎng（长大、校长）|小树苗一天天{长}高了。",
"7|胜地|地|de|用在词语后面，表示怎样做。|Adverb marker (-ly)|慢慢地 / 高兴地 / 认真地|dì（胜地、土地）≠ de（慢慢地）|妹妹高兴{地}跳了起来。"
];

<script>
(function(){
const KEY="p6cn";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const CN="一二三四五六七";

/* ---------- build data ---------- */
const W=[];
LESSONS.forEach(L=>L.w.forEach((s,i)=>{const [word,py,def,en,dp,zb,lj]=s.split("|");
  const part=L.parts.find(p=>i<p[1]);
  W.push({key:"m:"+L.n+word,lesson:L.n,num:i+1,part:part?part[0]:"",word,py,def,en,dp,zb,lj,poly:[]})}));
const findW=(n,word)=>W.find(e=>e.lesson===n&&e.word===word);
const PB=POLY.map(s=>{const [n,word,ch,py,def,en,dp,zb,lj]=s.split("|");const b={lesson:+n,word,ch,py,def,en,dp,zb,lj};const e=findW(+n,word);if(e)e.poly.push(b);b.entry=e;return b});
const plain=s=>s.replace(/[{}]/g,"");

/* marking a character or word inside a sentence */
function markAt(sentence,word,ch){
  let pos=-1;const wi=sentence.indexOf(word);
  if(wi>=0&&ch){pos=wi+word.indexOf(ch)}else if(ch){pos=sentence.indexOf(ch)}
  return pos<0?null:{a:sentence.slice(0,pos),c:sentence.charAt(pos),b:sentence.slice(pos+1)};
}
function wordHTML(e){const s=e.lj;let wi=s.indexOf(e.word),len=e.word.length;
  if(wi<0){const last=e.word.charAt(e.word.length-1);wi=s.indexOf(last);len=1}
  return wi<0?esc(s):esc(s.slice(0,wi))+`<span class="target">${esc(s.slice(wi,wi+len))}</span>`+esc(s.slice(wi+len));}

/* pinyin tone helpers for answer options */
const TONES={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
function parsePy(s){let base="",tone=0;for(const ch of s){let f=false;const lo=ch.toLowerCase();for(const v in TONES){const k=TONES[v].indexOf(lo);if(k>=0){base+=ch===lo?v:v.toUpperCase();tone=k+1;f=true;break}}if(!f)base+=ch}return{base,tone}}
function toned(base,tone){if(!tone)return base;const lo=base.toLowerCase();let pos=-1;
  if(lo.includes("a"))pos=lo.indexOf("a");else if(lo.includes("e"))pos=lo.indexOf("e");else if(lo.includes("ou"))pos=lo.indexOf("o");
  else for(let i=lo.length-1;i>=0;i--){if("iouü".includes(lo[i])){pos=i;break}}
  if(pos<0)return base;let mk=TONES[lo[pos]][tone-1];if(base[pos]!==lo[pos])mk=mk.toUpperCase();return base.slice(0,pos)+mk+base.slice(pos+1)}
/* 多音字 questions: the reading in the lesson word, plus each other reading */
const PQ=[];
PB.forEach((b,bi)=>{
  const e=b.entry;if(!e)return;
  const syl=e.py.split(/\s+/);const ix=e.word.indexOf(b.ch);
  let orig=syl.length===[...e.word].length&&ix>=0?syl[ix]:null;if(orig&&!parsePy(orig).tone&&b.ch!=="呀")orig=null;
  const m=markAt(e.lj,e.word,b.ch);
  if(orig&&m&&!PQ.some(q=>q.key==="p:"+e.key+b.ch))PQ.push({key:"p:"+e.key+b.ch,lesson:b.lesson,ch:b.ch,ans:orig,m,meaning:`在“${e.word}”里，意思是：${e.def}`,en:e.en,zb:b.zb,word:e.word,isOrig:true});
  const rs=b.py.split("/");const ss=b.lj.split("／");const defs=b.def.split(/(?=[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+[：:])/i);
  rs.forEach((r,i)=>{const s=ss[i]||ss[0];const mm=s.match(/\{(.)\}/);if(!mm)return;const at=s.indexOf("{");
    PQ.push({key:"p:L"+b.lesson+":"+bi+":"+r,lesson:b.lesson,ch:b.ch,ans:r,m:{a:plain(s.slice(0,at)),c:mm[1],b:plain(s.slice(at+3))},meaning:(rs.length>1?(defs.find(d=>d.startsWith(r))||b.def):b.def),en:b.en,zb:b.zb,word:e.word,isOrig:false})});
});
const READ={};PQ.forEach(q=>{(READ[q.ch]||(READ[q.ch]=new Set())).add(q.ans)});

function pyOptions(q){const opts=[q.ans];const seen=new Set([q.ans.toLowerCase()]);
  const add=x=>{if(opts.length<4&&!seen.has(x.toLowerCase())){seen.add(x.toLowerCase());opts.push(x)}};
  shuffle([...READ[q.ch]]).forEach(add);
  const {base}=parsePy(q.ans);shuffle([1,2,3,4]).forEach(t=>add(toned(base,t)));if(opts.length<4)add(base);
  return shuffle(opts)}

/* 字辨 questions: blank out the word's character, choose among look-alikes */
const ZQ=[];
W.forEach(e=>{const main=e.zb.split("。")[0].split("；")[0];const chars=[...main.matchAll(/（(.)）/g)].map(m=>m[1]);
  const target=chars.find(c=>e.word.includes(c));if(!target)return;
  const others=[...new Set(chars.filter(c=>c!==target&&!e.word.includes(c)))];if(!others.length)return;
  const m=markAt(e.lj,e.word,target);if(!m)return;
  ZQ.push({key:"z:"+e.key,lesson:e.lesson,e,ans:target,opts:[target,...others.slice(0,3)],m})});

/* ---------- hosted mode: Supabase storage when not inside Claude ---------- */
const CHNUM=601;
const SUPA={url:"https://yezqrwjtwwhnuawmjeod.supabase.co",key:"sb_publishable_HTl05cHUNd1LJ_-ai8GaAw_oXjk-NCT"};
const HOSTED=!(window.claude&&window.claude.use);
let LEARNER="";try{LEARNER=localStorage.getItem("vocab-learner")||""}catch(e){}
const cleanName=s=>String(s||"").trim().replace(/[^A-Za-z0-9 _-]/g,"").slice(0,30);
function supaDB(learner){
  const H={"apikey":SUPA.key,"Content-Type":"application/json"};
  const base=SUPA.url+"/rest/v1/hmt_progress"; /* 华文专用表（11-08 起），不再用 vocab_progress */
  const q=(kind,key)=>`?learner=eq.${encodeURIComponent(learner)}&chapter=eq.${CHNUM}&kind=eq.${kind}`+(key!=null?`&key=eq.${encodeURIComponent(key)}`:"");
  const fail=async r=>{let m="";try{const j=await r.json();m=[j.message,j.details,j.hint].filter(Boolean).join(" ")}catch(e){}return {code:"error "+r.status+(m?"："+m:""),message:m}};
  return {
    doc(p){const i=p.indexOf("/"),kind=p.slice(0,i),key=p.slice(i+1);return {
      async set(data){const r=await fetch(base+"?on_conflict=learner,chapter,kind,key",{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({learner,chapter:CHNUM,kind,key,data,updated_at:new Date().toISOString()})});if(!r.ok)throw await fail(r)},
      async get(){const r=await fetch(base+q(kind,key)+"&select=data",{headers:H});if(!r.ok)throw await fail(r);const j=await r.json();return {exists:j.length>0,data:()=>j[0]&&j[0].data}}
    }},
    collection(kind){return {onSnapshot(next,err){
      const load=async()=>{try{const r=await fetch(base+q(kind)+"&select=data",{headers:H});if(!r.ok)throw await fail(r);const j=await r.json();next({docs:j.map(x=>({data:()=>x.data})),metadata:{fromCache:false}})}catch(e){err&&err(e)}};
      load();const iv=setInterval(load,60000);return ()=>clearInterval(iv)}}}
  };
}
function namePrompt(){
  $("#bar").hidden=true;$("#status").hidden=true;
  $("#stage").innerHTML=`<p class="ask">谁在练习？</p>
    <p>输入一次名字就好。进度会用这个名字保存在网上，换一台设备也能接着练。</p>
    <form id="nameForm" class="row"><input id="nameIn" type="text" autocomplete="off" maxlength="30" placeholder="名字（用英文字母）" style="flex:1 1 200px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:18px"><button class="btn" type="submit">开始</button></form>
    <p class="hint">请用英文字母或拼音输入，每次、每台设备都用同一个名字（和英文练习网站一样）。</p>`;
  $("#nameForm").onsubmit=ev=>{ev.preventDefault();const n=cleanName($("#nameIn").value);if(!n)return;try{localStorage.setItem("vocab-learner",n)}catch(e){}location.reload()};
  $("#nameIn").focus();
}
/* ---------- learner state ---------- */
const LKEY=KEY+"-learner"+(HOSTED&&LEARNER?"-"+LEARNER.toLowerCase():""),ROUND=10,ROUND_ALL=20,MIX_AT=10,MIX_TRICKY=3,GRADUATE=2;
let L={seen:{},tricky:[],updatedAt:0};
try{const s=JSON.parse(localStorage.getItem(LKEY)||"null");if(s&&s.seen)L=s}catch(e){}
let tricky=new Set(L.tricky);let learnerDirty=false;
const loadL=()=>{try{const s=JSON.parse(localStorage.getItem(LKEY)||"null");if(s&&s.seen){L=s;tricky=new Set(L.tricky||[])}}catch(e){}};
const saveL=()=>{L.tricky=[...tricky];L.updatedAt=Date.now();learnerDirty=true;try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}scheduleSave()};
const lastAsked=k=>(L.seen[k]&&L.seen[k].last)||0;
function record(k,ok){loadL();const s=L.seen[k]||(L.seen[k]={n:0,ok:0,streak:0,last:0});s.n++;s.last=Date.now();let g=false;
  if(ok){s.ok++;s.streak++;if(tricky.has(k)&&s.streak>=GRADUATE){tricky.delete(k);g=true}}else{s.streak=0;tricky.add(k)}
  saveL();return g}

let mode="learn",setSel="L1";
try{const m=localStorage.getItem(KEY+"-mode");if(m)mode=m;const ss=localStorage.getItem(KEY+"-set");if(ss)setSel=ss}catch(e){}
const HM=(location.hash||"").match(/^#L([1-7])$/);if(HM){setSel="L"+HM[1];mode="learn"}else if(location.hash==="#all")setSel="round";
const lessonOf=()=>/^L\d$/.test(setSel)?+setSel.slice(1):0;
const POOLS={quiz:()=>W.map(e=>({key:e.key,lesson:e.lesson,e})),poly:()=>PQ,zb:()=>ZQ,learn:()=>W.map(e=>({key:e.key,lesson:e.lesson,e})),list:()=>W.map(e=>({key:e.key,lesson:e.lesson,e}))};
const MODE_NAME={quiz:"词义",poly:"多音字",zb:"字辨",learn:"闪卡",list:"词语表"};
function modePool(){const all=POOLS[mode==="progress"?"quiz":mode]();const n=lessonOf();
  if(setSel==="tricky")return all.filter(x=>tricky.has(x.key));
  return n?all.filter(x=>x.lesson===n):all}
function buildRound(){
  const all=modePool();const trk=all.filter(x=>tricky.has(x.key)).sort((a,b)=>lastAsked(a.key)-lastAsked(b.key));
  const fresh=shuffle(all.filter(x=>!L.seen[x.key]));const pick=[];
  const size=lessonOf()?all.length:ROUND_ALL; /* 选了某一课：一次做完整课；全部课文：每轮 20 题；易错题仍是每轮 ROUND=10 */
  const add=list=>{for(const x of list){if(pick.length>=size)break;if(!pick.includes(x))pick.push(x)}};
  if(trk.length>MIX_AT)add(trk.slice(0,MIX_TRICKY));
  add(fresh);add(trk);add(all.filter(x=>L.seen[x.key]&&!tricky.has(x.key)).sort((a,b)=>lastAsked(a.key)-lastAsked(b.key)));
  const nTricky=pick.filter(x=>tricky.has(x.key)).length,nNew=pick.filter(x=>!tricky.has(x.key)&&!L.seen[x.key]).length; /* 互不重叠：易错优先，其次新题，其余是复习 */
  return{items:shuffle(pick),mix:{nNew,nTricky,nReview:pick.length-nNew-nTricky}}}

function fillSets(){
  const sel=$("#set");const quizish=["quiz","poly","zb"].includes(mode);
  const pm=mode==="progress"?"quiz":mode;const all=POOLS[pm]();const tc=all.filter(x=>tricky.has(x.key)).length;
  const opts=[[ "round",quizish?"全部课文：下一轮（20题）":`全部课文（${all.length}）`]];
  LESSONS.forEach(l=>{const c=all.filter(x=>x.lesson===l.n).length;if(c)opts.push(["L"+l.n,`第${CN[l.n-1]}课《${l.t}》（${c}）`])});
  opts.push(["tricky",`我的易错题（${tc}）`]);
  sel.innerHTML=opts.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("");
  if(!opts.some(o=>o[0]===setSel))setSel="round";sel.value=setSel;
  const pool=modePool().filter(x=>setSel!=="tricky");const left=pool.filter(x=>!L.seen[x.key]).length;
  /* 选了某一课时，只数这一课的易错；括号里再给全部课文的总数 */
  const ln=lessonOf(),ltc=ln?all.filter(x=>x.lesson===ln&&tricky.has(x.key)).length:tc,
        tl=ln?`本课易错${quizish?"题":"词"} <b>${ltc}</b>${quizish?"":" 个"}（全部课文 ${tc}）`:`易错${quizish?"题":"词"} <b>${tc}</b>${quizish?"":" 个"}`;
  $("#status").innerHTML=quizish?`${MODE_NAME[mode]}：还没练过 <b>${left}</b> 题（共 ${pool.length||modePool().length}）· ${tl}`+(pool.length&&left===0?" · 都练过了，现在是复习。":""):
    `${tl} · 闪卡点“还不熟”或答错的题会加入易错。`;
}

const speakIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn=t=>`<button class="say" data-say="${esc(t)}" aria-label="听读音">${speakIcon}</button>`;
function say(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const v=new SpeechSynthesisUtterance(t);v.lang="zh-CN";v.rate=.8;
  const zh=s.getVoices().find(x=>/zh[-_]CN/i.test(x.lang));if(zh)v.voice=zh;s.speak(v)}catch(e){}}

function polyHTML(e){return e.poly.map(b=>`<div class="poly"><h4>多音字：${esc(b.ch)}（${esc(b.py)}）</h4>
  <p>${esc(b.def)} <span class="en">(${esc(b.en)})</span></p>
  <p><span class="lbl">搭配</span>${esc(b.dp)}</p><p><span class="lbl">字辨</span>${esc(b.zb)}</p>
  <p><span class="lbl">例句</span>${esc(plain(b.lj))} ${sayBtn(plain(b.lj))}</p></div>`).join("")}
function entryHTML(e,showLj=true){return `
  <p><b style="font-size:20px">${esc(e.word)}</b> <span class="py-inline">${esc(e.py)}</span> ${sayBtn(e.word)}</p>
  <p>${esc(e.def)} <span class="en">(${esc(e.en)})</span></p>
  <p><span class="lbl">搭配</span>${esc(e.dp)}</p>
  <p><span class="lbl">字辨</span>${esc(e.zb)}</p>
  ${showLj?`<p><span class="lbl">例句</span>${esc(e.lj)} ${sayBtn(e.lj)}</p>`:""}
  ${polyHTML(e)}`}
const where=x=>`第${CN[x.lesson-1]}课`;

/* ---------- quizzes ---------- */
let Q=null;
function emptyTricky(){$("#stage").innerHTML=`<p class="ask">还没有易错题</p><p>答错的题，或者闪卡上点了“还不熟”的词，会存到这里，方便以后再练。请在上面选别的练习。</p>`}
function makeQ(x){
  if(mode==="poly")return{x,ans:x.ans,opts:pyOptions(x)};
  if(mode==="zb")return{x,ans:x.ans,opts:shuffle(x.opts)};
  const e=x.e;const used=new Set([e.def]);const opts=[e.def];
  const same=shuffle(W.filter(d=>d.lesson===e.lesson)),rest=shuffle(W);
  for(const d of [...same,...rest]){if(opts.length===4)break;if(d===e||used.has(d.def))continue;used.add(d.def);opts.push(d.def)}
  return{x,ans:e.def,opts:shuffle(opts)}}
function startQuiz(){
  let items,mix=null;
  if(setSel==="tricky"){const t=modePool().sort((a,b)=>lastAsked(a.key)-lastAsked(b.key));if(!t.length){emptyTricky();return}items=shuffle(t.slice(0,ROUND))}
  else{const r=buildRound();items=r.items;mix=r.mix}
  if(!items.length){$("#stage").innerHTML=`<p>这一课没有这类题。请选别的课。</p>`;return}
  Q={qs:items.map(makeQ),k:0,score:0,missed:[],answered:false,mix,m:mode};renderQ()}
const mixLabel=m=>{const p=[];if(m.nNew)p.push(m.nNew+" 新");if(m.nTricky)p.push(m.nTricky+" 易错");if(m.nReview)p.push(m.nReview+" 复习");return p.join("，")};
function renderQ(){
  const {qs,k,score}=Q;const q=qs[k];const x=q.x;curL=x.lesson||curL;const pct=Math.round(k/qs.length*100);let body="",cls="opts";
  if(Q.m==="quiz"){body=`<p class="sentence">${wordHTML(x.e)}</p><p class="ask">“${esc(x.e.word)}”是什么意思？ ${sayBtn(x.e.word)}</p>`;cls+=" one"}
  else if(Q.m==="poly"){body=`<p class="sentence">${esc(x.m.a)}<span class="char">${esc(x.m.c)}</span>${esc(x.m.b)}</p><p class="ask">红色的“${esc(x.ch)}”在这里读什么？</p>`}
  else{body=`<p class="sentence">${esc(x.m.a)}<span class="blank">？</span>${esc(x.m.b)}</p><p class="ask">选出正确的字</p>`;cls+=" chars"}
  $("#stage").innerHTML=`
    <div class="meta"><span>第 ${k+1} / ${qs.length} 题 · ${where(x)}</span><span>${Q.mix?mixLabel(Q.mix)+" · ":""}得分 ${score}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${body}
    <div class="${cls}">${q.opts.map((o,i)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${"ABCD"[i]}</span><span${Q.m==="poly"?' class="py"':""}>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <p class="hint">键盘：按 1–4 选答案，按 Enter 下一题。</p>`;
  Q.answered=false}
const PRAISE=["答对了！","太棒了！","没错！","真厉害！","完全正确！"];

/* 时间：页面在屏幕上、并且在限定时间内有点击/滑动/按键，才算练习时间（active）；
   页面在屏幕上的时间另记（vis）。都用时间戳计算，浏览器定时器变慢也不会少算。每次练习记成一个 session。 */
const IDLE=()=>90000, SESS_GAP=600000, STEP_MAX=120000;
const TAB=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r1=x=>Math.round(x*10)/10;
let lastAct=Date.now(),lastT=Date.now(),onScreen=document.visibilityState==="visible",sess=null,sessN=0;
function accrue(){
  const now=Date.now(),from=lastT;lastT=now;
  if(!onScreen||now<=from)return;
  const step=now-from;if(step>STEP_MAX)return;
  const act=Math.max(0,Math.min(now,lastAct+IDLE())-from)/1000,vis=step/1000;
  if(!sess||from-sess.b>SESS_GAP)sess={id:TAB+"-"+(++sessN),a:from,b:now};else sess.b=now;
  const d=day();
  d.seconds=r1((d.seconds||0)+act);d.vis=r1((d.vis||0)+vis);
  const n=curLes();if(n){const l=LD(d,n);l.s=r1((l.s||0)+act);l.v=r1((l.v||0)+vis)}
  const t=d.tabs||(d.tabs={});t[mode]=r1((t[mode]||0)+act);
  const ss=d.sess||(d.sess=[]);let e=ss.find(x=>x.id===sess.id);
  if(!e){e={id:sess.id,a:sess.a,b:now,act:0,vis:0};ss.push(e);if(ss.length>40)ss.shift()}
  e.b=now;e.act=r1(e.act+act);e.vis=r1(e.vis+vis);
  saveU();dirty=true;
}

const fmtTime=s=>{s=Math.round(s);if(s<60)return s?s+" 秒":"0 分钟";const m=Math.round(s/60);return m<60?m+" 分钟":Math.floor(m/60)+" 小时 "+(m%60)+" 分钟"};

    <div class="tiles">${tile("今天",sum(rs.filter(r=>r.date===t)))}${tile("最近 7 天",sum(rs.filter(r=>r.date>=wkey)))}${tile("全部",sum(rs))}</div>
    ${rs.length?`<div class="tbl"><table><thead><tr><th>日期</th><th class="n">时间</th><th class="n">题数</th><th class="n">答对</th><th class="n">闪卡</th></tr></thead><tbody>
      ${rs.map(r=>`<tr><td>${nice(r.date)}</td><td class="n">${fmtTime(r.seconds)}</td><td class="n">${r.questions}</td><td class="n">${r.questions?Math.round(r.correct/r.questions*100)+"%":"–"}</td><td class="n">${r.cards}</td></tr>${r.missed.size?`<tr><td colspan="5" style="font-size:14px;color:var(--muted);padding-top:0">答错：${esc([...r.missed].slice(0,15).join("、"))}${r.missed.size>15?` 等 ${r.missed.size} 个`:""}</td></tr>`:""}`).join("")}
      </tbody></table></div>`:`<p>还没有练习记录。页面打开并在使用时会计时；每答一题、每看一张闪卡都会记在这里。</p>`}
    <p class="src">${src} 只在页面打开并使用时计时（90 秒没有操作就暂停）。</p>`}

/* ---------- wiring ---------- */
function go(){
  if(HOSTED&&!LEARNER){namePrompt();return}
  try{localStorage.setItem(KEY+"-mode",mode);localStorage.setItem(KEY+"-set",setSel)}catch(e){}
  fillSets();
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("#bar").hidden=mode==="progress";$("#status").hidden=mode==="progress";flush();
  if(mode==="progress"){startProgress();return}
  if(["quiz","poly","zb"].includes(mode))startQuiz();else if(mode==="learn")startLearn();else startList()}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;go()});
$("#set").onchange=e=>{setSel=e.target.value;go()};
document.addEventListener("click",ev=>{
  const s=ev.target.closest("[data-say]");if(s){ev.stopPropagation();ev.preventDefault();say(s.dataset.say);return}
  const o=ev.target.closest(".opt");if(o&&Q){answer(o.dataset.o);return}
  if(ev.target.closest("#next")){next();return}
  const st=ev.target.closest("[data-star]");if(st){const k=st.dataset.star;loadL();tricky.has(k)?tricky.delete(k):tricky.add(k);saveL();st.setAttribute("aria-pressed",tricky.has(k));fillSets()}
},true);
document.addEventListener("keydown",ev=>{
  if(!["quiz","poly","zb"].includes(mode)||!Q||ev.target.tagName==="INPUT"||ev.target.tagName==="SELECT")return;
  if(!Q.answered&&/^[1-4]$/.test(ev.key)){const b=document.querySelectorAll(".opt")[+ev.key-1];if(b)answer(b.dataset.o)}
  else if(Q.answered&&ev.key==="Enter"&&document.activeElement?.id!=="next"){ev.preventDefault();next()}});

if(HOSTED){const w=$("#who");w.hidden=false;w.innerHTML=(LEARNER?`正在练习：<b>${esc(LEARNER)}</b> · <button id="chg">换名字</button> · `:"")+`<a href="index.html">回到首页</a>`;const c=$("#chg");if(c)c.onclick=()=>{try{localStorage.removeItem("vocab-learner")}catch(e){}location.reload()}}
$("#sub").textContent=`欢乐伙伴 6A · 第一至七课 · ${W.length} 个词语 · ${PQ.length} 道多音字题 · ${ZQ.length} 道字辨题`;
$("#rule").innerHTML=`每个词语都有：<mark>拼音、释义、英文、搭配、字辨、例句</mark>。先选一课，按 ①→④ 的顺序练：先闪卡，再做题。选一课时一次做完这一课的全部题，选“全部课文”每轮 20 题；答错的会进入<b>易错题</b>，连续答对两次才移出。`;
$("#foot").textContent="词语来自《欢乐伙伴》6A 第一至七课（标有拼音的词）。释义、搭配和例句为练习用，请以老师的笔记为准。";
fillSets();go();
})();
</script>
